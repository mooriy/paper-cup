<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>紙コップ水シミュレーター</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            touch-action: none;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .header {
            position: fixed;
            right: 10px;
            bottom: 10px;
            display: flex;
            align-items: baseline;
            gap: 6px;
            color: white;
            opacity: 0.8;
            z-index: 10;
            pointer-events: none;
        }

        .header h1 {
            font-size: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 10px;
            opacity: 0.9;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .status {
            position: fixed;
            left: 0;
            right: 0;
            top: 70%;
            color: white;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .sensitivity {
            position: fixed;
            left: 0;
            right: 0;
            color: white;
            font-size: 14px;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .sensitivity input {
            width: 50%;
            max-width: 260px;
            touch-action: auto;
        }

        .permission-prompt {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            flex-direction: column;
            padding: 20px;
        }

        .permission-prompt.hidden {
            display: none;
        }

        .permission-content {
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 300px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .permission-content h2 {
            margin-bottom: 15px;
            color: #333;
            font-size: 18px;
        }

        .permission-content p {
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:active {
            transform: scale(0.95);
            opacity: 0.8;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:active {
            transform: scale(0.95);
            opacity: 0.8;
        }

        .info {
            position: fixed;
            bottom: 10px;
            left: 10px;
            color: white;
            font-size: 10px;
            opacity: 0.7;
            z-index: 10;
        }

        .motion-permission {
            position: fixed;
            left: 10px;
            right: 10px;
            bottom: 32px;
            color: white;
            font-size: 12px;
            z-index: 10;
        }

        .motion-permission button {
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="canvas"></canvas>
        <div class="header">
            <h1>紙コップ水シミュレーター</h1>
            <p>バージョン 1.0.0</p>
        </div>
        <div class="status" id="status">
            <span id="waterPercent">水の残量: 100%</span>
            <button class="btn-primary" id="resetBtn">リセット</button>
        </div>
        <div class="sensitivity">
            <label for="sensitivity">感度</label>
            <input type="range" id="sensitivity" min="0.2" max="3" step="0.1" value="1">
            <span id="sensitivityValue">1.0x</span>
        </div>
    </div>

    <div class="info" id="info">
        Angle: 0°
    </div>
    <div class="motion-permission" id="motionPermission" hidden>
        <div id="motionPermissionStatus" role="status"></div>
        <button class="btn-primary" id="motionPermissionBtn" type="button">モーションセンサーを有効化</button>
    </div>

    <script src="cup.js"></script>
</body>
</html>
