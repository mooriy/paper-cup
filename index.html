<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>紙コップ水シミュレーター - Initial D Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            touch-action: none;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            z-index: 10;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
        }

        #canvas {
            border: 3px solid white;
            border-radius: 8px;
            background: linear-gradient(#f6f9ff, #dfe8f5);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 100%;
            max-height: 70vh;
            display: block;
        }

        .status {
            margin-top: 12px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            gap: 16px;
            align-items: center;
            z-index: 10;
        }

        .controls {
            margin-top: 20px;
            color: white;
            text-align: center;
            font-size: 12px;
            z-index: 10;
        }

        .permission-prompt {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            flex-direction: column;
            padding: 20px;
        }

        .permission-prompt.hidden {
            display: none;
        }

        .permission-content {
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 300px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .permission-content h2 {
            margin-bottom: 15px;
            color: #333;
            font-size: 18px;
        }

        .permission-content p {
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:active {
            transform: scale(0.95);
            opacity: 0.8;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:active {
            transform: scale(0.95);
            opacity: 0.8;
        }

        .info {
            position: fixed;
            bottom: 10px;
            left: 10px;
            color: white;
            font-size: 10px;
            opacity: 0.7;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="permission-prompt" id="permissionPrompt">
        <div class="permission-content">
            <h2>🏎️ イニシャルD</h2>
            <p>デバイスの傾きを検出するために、モーションセンサーへのアクセスを許可してください。</p>
            <div class="button-group">
                <button class="btn-primary" id="permissionAllow">許可する</button>
                <button class="btn-secondary" id="permissionDeny">キャンセル</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>🏎️ 紙コップ水シミュレーター</h1>
            <p>iPhone を傾けて水の動きを楽しむ</p>
        </div>
        <canvas id="canvas"></canvas>
        <div class="status">
            <span id="waterPercent">水の残量: 100%</span>
            <button class="btn-primary" id="resetBtn">リセット</button>
        </div>
        <div class="controls">
            <p>💡 iPhone/iPad を傾けてコップを動かしてください<br>
            デスクトップ: マウスで傾きを操作 / タップで水を注ぎ足す</p>
        </div>
    </div>

    <div class="info" id="info">
        Angle: 0°
    </div>

    <script src="cup.js"></script>
</body>
</html>
